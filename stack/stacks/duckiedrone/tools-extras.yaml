# Optional Duckiedrone tools. Nothing here is needed to fly or to use the Dashboard; these are
# containers a developer turns on to inspect the robot. Nothing starts this stack automatically:
#
#   dts stack up   -H <robot> -d duckiedrone/tools-extras
#   dts stack down -H <robot>    duckiedrone/tools-extras
#
# These containers need `zenoh-router` from the ros2/duckiedrone stack, which runs in a different
# compose project. They cannot declare it in depends_on, they just retry until it is up.
#
# `name` pins the compose project. Without it the project would default to the name of this
# directory, which the other optional drone stacks share, and taking one down would remove the
# containers of the others.
name: duckiedrone-tools-extras

services:

  foxglove-bridge:
    image: ${REGISTRY}/duckietown/dt-ros2-interface:ente-${ARCH}
    container_name: ros2-foxglove-bridge
    restart: unless-stopped
    network_mode: host
    command: ["bash", "-c", ". /opt/ros/jazzy/setup.bash && ros2 launch foxglove_bridge foxglove_bridge_launch.xml"]
    environment:
      ROS_DOMAIN_ID: 42
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
