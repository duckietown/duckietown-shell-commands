# Optional Duckiedrone sensors. Nothing starts this stack automatically; only the bottom ToF is
# needed to fly, so the other sensors are opt-in:
#
#   dts stack up   -H <robot> -d duckiedrone/sensors-extras
#   dts stack down -H <robot>    duckiedrone/sensors-extras
#
# The ROS2 bridges below need `zenoh-router` from the ros2/duckiedrone stack, which runs in a
# different compose project. They cannot declare it in depends_on, they just retry until it is up.
#
# `name` pins the compose project. Without it the project would default to the name of this
# directory, which the other optional drone stacks share, and taking one down would remove the
# containers of the others.
name: duckiedrone-sensors-extras

services:

  driver-tof-front:
    image: ${REGISTRY}/duckietown/dt-duckiebot-interface:ente-${ARCH}
    container_name: driver-tof-front
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      DT_SUPERUSER: 1
      DT_LAUNCHER: sensor-tof-front
      DTPS_DATA_AVAILABILITY_TIMEOUT: 1
    volumes:
      - /data:/data
      # dtps sockets
      - /data/ramdisk/dtps:/dtps
      # avahi socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

  driver-tof-left:
    image: ${REGISTRY}/duckietown/dt-duckiebot-interface:ente-${ARCH}
    container_name: driver-tof-left
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      DT_SUPERUSER: 1
      DT_LAUNCHER: sensor-tof-left
      DTPS_DATA_AVAILABILITY_TIMEOUT: 1
    volumes:
      - /data:/data
      # dtps sockets
      - /data/ramdisk/dtps:/dtps
      # avahi socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

  driver-tof-right:
    image: ${REGISTRY}/duckietown/dt-duckiebot-interface:ente-${ARCH}
    container_name: driver-tof-right
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      DT_SUPERUSER: 1
      DT_LAUNCHER: sensor-tof-right
      DTPS_DATA_AVAILABILITY_TIMEOUT: 1
    volumes:
      - /data:/data
      # dtps sockets
      - /data/ramdisk/dtps:/dtps
      # avahi socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

  driver-tof-top:
    image: ${REGISTRY}/duckietown/dt-duckiebot-interface:ente-${ARCH}
    container_name: driver-tof-top
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      DT_SUPERUSER: 1
      DT_LAUNCHER: sensor-tof-top
      DTPS_DATA_AVAILABILITY_TIMEOUT: 1
    volumes:
      - /data:/data
      # dtps sockets
      - /data/ramdisk/dtps:/dtps
      # avahi socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

  tof-front:
    image: ${REGISTRY}/duckietown/dt-ros2-interface:ente-${ARCH}
    container_name: ros2-tof-front
    restart: unless-stopped
    network_mode: host
    security_opt:
      - seccomp=unconfined
    environment:
      DT_LAUNCHER: sensor-tof-front
      DT_SUPERUSER: 1
      ROS_DOMAIN_ID: 42
    volumes:
      - /data/ramdisk/dtps:/dtps
      # avahi socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

  tof-left:
    image: ${REGISTRY}/duckietown/dt-ros2-interface:ente-${ARCH}
    container_name: ros2-tof-left
    restart: unless-stopped
    network_mode: host
    security_opt:
      - seccomp=unconfined
    environment:
      DT_LAUNCHER: sensor-tof-left
      DT_SUPERUSER: 1
      ROS_DOMAIN_ID: 42
    volumes:
      - /data/ramdisk/dtps:/dtps
      # avahi socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

  tof-right:
    image: ${REGISTRY}/duckietown/dt-ros2-interface:ente-${ARCH}
    container_name: ros2-tof-right
    restart: unless-stopped
    network_mode: host
    security_opt:
      - seccomp=unconfined
    environment:
      DT_LAUNCHER: sensor-tof-right
      DT_SUPERUSER: 1
      ROS_DOMAIN_ID: 42
    volumes:
      - /data/ramdisk/dtps:/dtps
      # avahi socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

  tof-top:
    image: ${REGISTRY}/duckietown/dt-ros2-interface:ente-${ARCH}
    container_name: ros2-tof-top
    restart: unless-stopped
    network_mode: host
    security_opt:
      - seccomp=unconfined
    environment:
      DT_LAUNCHER: sensor-tof-top
      DT_SUPERUSER: 1
      ROS_DOMAIN_ID: 42
    volumes:
      - /data/ramdisk/dtps:/dtps
      # avahi socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
